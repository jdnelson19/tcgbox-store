name: Deploy storefront to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build storefront
        env:
          VITE_SHOPIFY_STORE_DOMAIN: ${{ secrets.VITE_SHOPIFY_STORE_DOMAIN }}
          VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_TOKEN }}
          VITE_SHOPIFY_API_VERSION: ${{ vars.VITE_SHOPIFY_API_VERSION || '2026-01' }}
          VITE_SHOPIFY_FEATURED_COLLECTION_HANDLE: ${{ vars.VITE_SHOPIFY_FEATURED_COLLECTION_HANDLE || 'featured' }}
          VITE_SHOPIFY_ALL_PRODUCTS_COLLECTION_HANDLE: ${{ vars.VITE_SHOPIFY_ALL_PRODUCTS_COLLECTION_HANDLE || 'all' }}
          VITE_SHOPIFY_COLLECTION_ORDER: ${{ vars.VITE_SHOPIFY_COLLECTION_ORDER || '' }}
          VITE_SHOPIFY_PUBLIC_STORE_URL: ${{ vars.VITE_SHOPIFY_PUBLIC_STORE_URL || 'https://shop.tcgbox.store' }}
        run: npm run build --workspace storefront

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/storefront/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
